<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WP Security Scanner</title>
  <style>
    :root {
      --primary-color: #0073aa;
      --secondary-color: #00a0d2;
      --success-color: #46b450;
      --danger-color: #dc3232;
      --warning-color: #f56e28;
      --info-color: #00a0d2;
      --bg-light: #ffffff;
      --bg-secondary: #f7f9fc;
      --text-primary: #1e1e1e;
      --text-secondary: #666;
      --border-color: #e2e4e7;
      --border-radius: 8px;
      --box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --primary-color: #2ea2cc;
      --secondary-color: #00a0d2;
      --success-color: #5bca5f;
      --danger-color: #ff6b6b;
      --warning-color: #ff8c42;
      --info-color: #4fc3f7;
      --bg-light: #1e1e1e;
      --bg-secondary: #2d2d30;
      --text-primary: #e4e4e4;
      --text-secondary: #b4b4b4;
      --border-color: #3e3e42;
      --box-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      width: 420px;
      padding: 0;
      margin: 0;
      background-color: var(--bg-light);
      color: var(--text-primary);
      transition: var(--transition);
    }

    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      padding: 16px 20px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--box-shadow);
    }

    .header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      font-size: 24px;
    }

    .theme-toggle {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .theme-toggle:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: rotate(20deg);
    }

    .content {
      padding: 16px 20px;
    }

    #status {
      padding: 14px;
      text-align: center;
      border-radius: var(--border-radius);
      font-weight: 600;
      margin-bottom: 16px;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 15px;
    }

    #status.yes {
      background: linear-gradient(135deg, rgba(70, 180, 80, 0.15), rgba(70, 180, 80, 0.05));
      color: var(--success-color);
      border: 2px solid var(--success-color);
    }

    #status.no {
      background: linear-gradient(135deg, rgba(220, 50, 50, 0.15), rgba(220, 50, 50, 0.05));
      color: var(--danger-color);
      border: 2px solid var(--danger-color);
    }

    .section {
      background-color: var(--bg-secondary);
      padding: 14px;
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-color);
      margin: 0 0 10px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid var(--border-color);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      font-weight: 500;
      color: var(--text-secondary);
    }

    .info-value {
      font-weight: 600;
      color: var(--text-primary);
      text-align: right;
      max-width: 60%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      transition: var(--transition);
      box-shadow: var(--box-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0, 115, 170, 0.3);
    }

    .btn:disabled {
      background: #cccccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
      opacity: 0.6;
    }

    #plugins {
      max-height: 200px;
      overflow-y: auto;
    }

    .plugin-item {
      background: var(--bg-light);
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      border-left: 3px solid var(--primary-color);
    }

    .plugin-name {
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .plugin-version {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .cve-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 4px;
    }

    .cve-critical {
      background-color: var(--danger-color);
      color: white;
    }

    .cve-high {
      background-color: var(--warning-color);
      color: white;
    }

    .cve-medium {
      background-color: var(--info-color);
      color: white;
    }

    .cve-low {
      background-color: var(--success-color);
      color: white;
    }

    #userResults, #regResults, #pathResults, #misconfigResults, 
    #restRoutesResults, #headersResults, #xmlrpcDeepResults, #dirListingsResults {
      background-color: var(--bg-secondary);
      padding: 12px;
      border-radius: var(--border-radius);
      font-size: 13px;
      margin-bottom: 12px;
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      display: none;
    }

    .username-chip {
      display: inline-block;
      background: var(--primary-color);
      color: white;
      padding: 5px 12px;
      border-radius: 16px;
      margin: 4px 4px 4px 0;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
    }

    .username-chip:hover {
      background: var(--secondary-color);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0, 115, 170, 0.3);
    }

    .username-chip:active {
      transform: translateY(0);
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: var(--success-color);
      color: white;
      padding: 12px 20px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      transform: translateX(100px);
      transition: all 0.3s ease;
      z-index: 10000;
    }

    .notification.show {
      opacity: 1;
      transform: translateX(0);
    }

    footer {
      font-size: 11px;
      text-align: center;
      color: var(--text-secondary);
      padding: 12px 20px;
      border-top: 1px solid var(--border-color);
    }

    .loading {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary-color);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 20px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="header-icon">🛡️</span>WP Security Scanner</h1>
    <button class="theme-toggle" id="themeToggle" title="Toggle dark mode">🌙</button>
  </div>

  <div class="content">
    <div id="status">Checking...</div>

    <div class="section" id="infoSection">
      <div class="section-title">📋 Site Information</div>
      <div class="info-row">
        <span class="info-label">Site Title</span>
        <span class="info-value" id="siteTitle">Fetching...</span>
      </div>
      <div class="info-row">
        <span class="info-label">WP Version</span>
        <span class="info-value" id="wpVersion">Fetching...</span>
      </div>
      <div class="info-row">
        <span class="info-label">Theme</span>
        <span class="info-value" id="theme">Fetching...</span>
      </div>
      <div class="info-row">
        <span class="info-label">REST API</span>
        <span class="info-value" id="restApi">Fetching...</span>
      </div>
      <div class="info-row">
        <span class="info-label">XML-RPC</span>
        <span class="info-value" id="xmlrpc">Fetching...</span>
      </div>
    </div>

    <div class="section" id="pluginsSection" style="display: none;">
      <div class="section-title">🔌 Detected Plugins</div>
      <div id="plugins"></div>
    </div>

    <div class="section" id="wpVulnSection" style="display: none;">
      <div class="section-title">⚠️ WordPress Core Vulnerabilities</div>
      <div id="wpVulnerabilities"></div>
    </div>

    <button class="btn btn-primary" id="scanUsers" disabled>
      <span>🔍</span><span>Scan for Usernames (Aggressive)</span>
    </button>
    <div id="userResults"></div>

    <button class="btn btn-primary" id="checkReg" disabled style="margin-top:8px;">
      <span>📝</span><span>Check User Registration Status</span>
    </button>
    <div id="regResults"></div>

    <button class="btn btn-primary" id="checkPath" disabled style="margin-top:8px;">
      <span>📂</span><span>Check Path Disclosure</span>
    </button>
    <div id="pathResults"></div>

    <button class="btn btn-primary" id="checkMisconfig" disabled style="margin-top:8px;">
      <span>🚨</span><span>Check Misconfigurations (45+ paths)</span>
    </button>
    <div id="misconfigResults"></div>

    <button class="btn btn-primary" id="checkRestRoutes" disabled style="margin-top:8px;">
      <span>🌐</span><span>List REST API Routes</span>
    </button>
    <div id="restRoutesResults"></div>

    <button class="btn btn-primary" id="checkHeaders" disabled style="margin-top:8px;">
      <span>🔒</span><span>Check Security Headers</span>
    </button>
    <div id="headersResults"></div>

    <button class="btn btn-primary" id="checkXmlrpcDeep" disabled style="margin-top:8px;">
      <span>📡</span><span>Deep XML-RPC Scan</span>
    </button>
    <div id="xmlrpcDeepResults"></div>

    <button class="btn btn-primary" id="checkDirListings" disabled style="margin-top:8px;">
      <span>📁</span><span>Check Directory Listings</span>
    </button>
    <div id="dirListingsResults"></div>
  </div>

  <footer>🛡️ Security Scanner | v3.0 | Aggressive Recon Edition</footer>
  <script src="popup.js"></script>
</body>
</html>
